<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Badge Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.6"/>

  <!-- Warehouse Illustration Container -->
  <g filter="url(#shadow)">
    
    <!-- Heavy Industrial Foundation / Concrete Slab -->
    <rect x="64" y="408" width="384" height="28" rx="8" fill="#475569"/>
    <rect x="80" y="408" width="352" height="10" fill="#64748B"/>
    <rect x="180" y="408" width="152" height="28" fill="#94A3B8"/>

    <!-- Main Warehouse Facade Wall -->
    <path d="M100 236 L412 236 L412 408 L100 408 Z" fill="#F8FAFC"/>
    
    <!-- Structural Corner Columns -->
    <rect x="100" y="236" width="22" height="172" fill="#E2E8F0"/>
    <rect x="390" y="236" width="22" height="172" fill="#CBD5E1"/>

    <!-- Industrial Gable Roof (Techo a dos aguas con alero) -->
    <polygon points="72,236 256,128 440,236 424,256 256,156 88,256" fill="url(#roofGrad)"/>
    <polygon points="88,256 256,156 424,256 412,246 256,146 100,246" fill="#0369A1" opacity="0.4"/>

    <!-- Roof Ridge Ventilator (Linterna / Cumbrera de ventilación industrial) -->
    <rect x="226" y="106" width="60" height="26" rx="4" fill="#0284C7"/>
    <rect x="234" y="112" width="44" height="8" rx="2" fill="#38BDF8"/>

    <!-- Main Industrial Gate / Portón Corredizo (Roll-up Shutter) -->
    <g>
      <!-- Door Frame -->
      <rect x="160" y="260" width="192" height="148" rx="8" fill="#0F172A"/>
      <!-- Door Body in Emerald Green -->
      <rect x="166" y="266" width="180" height="142" rx="4" fill="url(#gateGrad)"/>

      <!-- Corrugated Slats (Chapa acanalada / seccional) -->
      <line x1="166" y1="290" x2="346" y2="290" stroke="#064E3B" stroke-width="4"/>
      <line x1="166" y1="314" x2="346" y2="314" stroke="#064E3B" stroke-width="4"/>
      <line x1="166" y1="338" x2="346" y2="338" stroke="#064E3B" stroke-width="4"/>
      <line x1="166" y1="362" x2="346" y2="362" stroke="#064E3B" stroke-width="4"/>
      <line x1="166" y1="386" x2="346" y2="386" stroke="#064E3B" stroke-width="4"/>

      <!-- Gate Handle / Lock -->
      <rect x="246" y="376" width="20" height="14" rx="3" fill="#0F172A"/>
      <rect x="251" y="380" width="10" height="6" rx="1" fill="#34D399"/>
    </g>

    <!-- Side Logistics Windows / Service Door -->
    <g>
      <!-- Small Service Door -->
      <rect x="362" y="324" width="34" height="84" rx="3" fill="#CBD5E1"/>
      <rect x="366" y="328" width="26" height="76" rx="2" fill="#94A3B8"/>
      <circle cx="386" cy="368" r="2.5" fill="#0F172A"/>

      <!-- Upper Window High Light -->
      <rect x="128" y="270" width="22" height="22" rx="3" fill="#38BDF8" opacity="0.8"/>
      <rect x="128" y="302" width="22" height="22" rx="3" fill="#38BDF8" opacity="0.8"/>
    </g>

    <!-- Emerald "Disponible / Industrial" Badge Marker on Top Right -->
    <g>
      <circle cx="410" cy="116" r="42" fill="#059669"/>
      <circle cx="410" cy="116" r="36" fill="#10B981"/>
      <!-- Check / Key Graphic inside Badge -->
      <path d="M394 116 L406 128 L428 104" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>
</svg>
